name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build project
        run: |
          # Example build commands for a Node.js project
          npm install
          npm run build
          tar -cvzf dist.gz dist
          tar -cvzf node_modules.gz node_modules

      - name: Deploy to Ubuntu server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          source: "./dist.gz,./node_modules.gz"
          target: "/home/ubuntu/api-tcgplayer" 

      - name: Deploy and Build
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            cd api-tcgplayer
            git pull origin master
            tar -xvzf dist.gz
            tar -xvzf node_modules.gz
            npm run migration:run
            pm2 restart api-tcgplayer
            rm dist.gz
            rm node_modules.gz
#pm2 start dist/main.js -n api-tcgplayer